<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приглашение от Бурундука 🐿️</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #5a189a 0%, #9d4edd 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Летающие фиолетовые сердечки на фоне */
    .heart {
      position: absolute;
      color: rgba(255, 255, 255, 0.15);
      font-size: 24px;
      animation: float 6s infinite ease-in-out alternate;
      user-select: none;
      pointer-events: none;
    }
    @keyframes float {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-30px) scale(1.2); }
    }

    /* Контейнер для слайдов */
    .slide-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 420px;
      width: 90%;
      position: relative;
      z-index: 10;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    /* Скрываем неактивные слайды */
    .slide { display: none; }
    .slide.active { display: block; animation: slideIn 0.4s ease forwards; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .capybara {
      font-size: 70px;
      margin-bottom: 10px;
      display: inline-block;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h2 {
      color: #3c096c;
      margin-top: 0;
      font-size: 22px;
      line-height: 1.4;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #7b2cbf;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 15px;
    }
    button:hover { background: #5a189a; }
    button:active { transform: scale(0.97); }

    /* Календарь */
    .calendar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .date-btn {
      background: #f3e8ff;
      color: #5a189a;
      border: 2px solid transparent;
      padding: 15px 5px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .date-btn:hover { background: #e0caff; }
    
    /* Выбранная дата */
    .date-btn.selected {
      background: #7b2cbf;
      color: white;
      border-color: #3c096c;
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(123, 44, 191, 0.4);
    }

    .date-btn span { font-size: 20px; margin-bottom: 5px; }

    #submitDateBtn {
      display: none; /* Появится только после выбора */
      background: #2b8a3e; /* Зеленая кнопка для действия */
    }
    #submitDateBtn:hover { background: #237032; }

    .status {
      margin-top: 15px;
      font-size: 14px;
      color: #5a189a;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <!-- Генерация фоновых сердечек (через скрипт ниже) -->
  <div id="hearts-container"></div>

  <div class="slide-container">

    <!-- СЛАЙД 1 -->
    <div class="slide active" id="slide1">
      <div class="capybara">🐿️</div>
      <h2>Бурундук может не только орешки красть) :/</h2>
      <button onclick="nextSlide(1)">Согласиться</button>
    </div>

    <!-- СЛАЙД 2 -->
    <div class="slide" id="slide2">
      <div class="capybara">🎬</div>
      <h2>Бурундук очень хочет пригласить тебя в кино, поэтому решил сделать это так.</h2>
      <button onclick="openCalendar()">Посмотрим</button>
    </div>

    <!-- СЛАЙД 3 (Календарь) -->
    <div class="slide" id="slide3">
      <div class="capybara">🗓️</div>
      <h2>Выбери день:</h2>
      
      <div class="calendar" id="calendar">
        <!-- Кнопки дат будут добавлены через JS -->
      </div>

      <button id="submitDateBtn" onclick="sendDate()">Передать бурундуку 🐿️</button>
      <div class="status" id="statusMsg"></div>
    </div>

    <!-- СЛАЙД 4 (Финальный) -->
    <div class="slide" id="slide4">
      <div class="capybara">✨</div>
      <h2>Спасибо, что согласилась, уверен это было не просто, я ценю это.</h2>
    </div>

  </div>

  <script>
    // ⚠️ ВСТАВЬТЕ СЮДА ВАШ НОВЫЙ ТОКЕН
    const BOT_TOKEN = 'ВСТАВЬТЕ_НОВЫЙ_ТОКЕН';
    const CHAT_ID = '1182788244';
    
    let selectedDate = null;

    // --- 1. Генерация фоновых сердечек ---
    const heartsContainer = document.getElementById('hearts-container');
    const heartSymbols = ['💜', '💜', '🖤', '🤍'];
    for (let i = 0; i < 20; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.top = Math.random() * 100 + 'vh';
      heart.style.animationDelay = Math.random() * 5 + 's';
      heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
      heartsContainer.appendChild(heart);
    }

    // --- 2. Переключение слайдов ---
    function nextSlide(currentId) {
      document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
      document.getElementById('slide' + (currentId + 1)).classList.add('active');
    }

    // --- 3. Логика календаря ---
    function openCalendar() {
      nextSlide(2); // Открываем 3-й слайд
      
      const calendar = document.getElementById('calendar');
      calendar.innerHTML = ''; // Очистка

      // Генерируем 8 дат (например, следующие выходные или просто числа)
      // Для красоты сделаем даты вида "12 Окт"
      const today = new Date();
      const months = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];
      
      for (let i = 1; i <= 8; i++) {
        let d = new Date(today);
        d.setDate(today.getDate() + i);
        
        let dayNum = d.getDate();
        let monthName = months[d.getMonth()];
        let fullDateStr = dayNum + ' ' + monthName + ' ' + d.getFullYear();

        const btn = document.createElement('button');
        btn.className = 'date-btn';
        btn.innerHTML = `<span>🌰</span>${dayNum}<br><small>${monthName}</small>`;
        
        btn.onclick = () => {
          // Снимаем выделение со всех
          document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('selected'));
          // Выделяем текущую
          btn.classList.add('selected');
          selectedDate = fullDateStr;
          
          // Показываем кнопку отправки
          document.getElementById('submitDateBtn').style.display = 'block';
        };
        
        calendar.appendChild(btn);
      }
    }

    // --- 4. Отправка в Telegram ---
    async function sendDate() {
      if (!selectedDate) return;

      const btn = document.getElementById('submitDateBtn');
      const status = document.getElementById('statusMsg');
      
      btn.disabled = true;
      btn.innerText = 'Отправляем...';
      status.innerText = '';

      const message = `🐿️ Бурундук доволен!\n\nОна выбрала дату для похода в кино: 📅 ${selectedDate}`;

      try {
        const response = await fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: CHAT_ID, text: message })
        });

        const data = await response.json();
        
        if (data.ok) {
          nextSlide(3); // Переходим на финальный слайд "Спасибо"
        } else {
          throw new Error(data.description);
        }
      } catch (err) {
        console.error(err);
        status.innerText = 'Ошибка отправки. Попробуйте еще раз.';
        status.style.color = 'red';
        btn.disabled = false;
        btn.innerText = 'Передать бурундуку 🐿️';
      }
    }
  </script>
</body>
</html>
